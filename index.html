<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <title>Chef's Tava · Premium Menü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Outfit"', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'],
            script: ['"Cormorant Garamond"', 'serif'],
          },
          colors: {
            gold: {
              50: '#fdf8ed',
              100: '#f9ecc9',
              200: '#f2d690',
              300: '#ebbf5c',
              400: '#e5a93a',
              500: '#d98e23',
              600: '#bf6f1b',
              700: '#9e5219',
              800: '#82421c',
              900: '#6e381b',
            },
            cream: '#f7f2e9',
            ivory: '#fdfbf6',
            sand: '#efe7d8',
            cocoa: '#2a2118',
            ink: '#0a0a0c',
            espresso: '#121013',
            char: '#1a181c',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both',
            'fade-in': 'fadeIn 0.8s ease-out both',
            'scale-in': 'scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 3s linear infinite',
            'aurora': 'aurora 18s ease-in-out infinite alternate',
            'spin-slow': 'spin 16s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(28px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.94)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% center' },
              '100%': { backgroundPosition: '200% center' },
            },
            aurora: {
              '0%': { transform: 'translate(0, 0) scale(1)' },
              '50%': { transform: 'translate(40px, -30px) scale(1.15)' },
              '100%': { transform: 'translate(-30px, 20px) scale(1.05)' },
            },
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    html { scroll-behavior: smooth; }

    body {
      background-color: #f7f2e9;
      color: #2a2118;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Premium fine grain texture overlay */
    .grain::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .text-gold-gradient {
      background: linear-gradient(110deg, #bf6f1b 0%, #d98e23 45%, #9e5219 60%, #bf6f1b 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shimmer-text {
      background: linear-gradient(110deg, #9e5219 20%, #e5a93a 40%, #d98e23 50%, #e5a93a 60%, #9e5219 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .glass {
      background: rgba(253, 251, 246, 0.65);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      border: 1px solid rgba(42, 33, 24, 0.07);
    }

    .gold-border {
      position: relative;
    }
    .gold-border::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(140deg, rgba(217,142,35,0.5), rgba(42,33,24,0.05) 40%, rgba(191,111,27,0.35));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(42, 33, 24, 0.18); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(217, 142, 35, 0.6); background-clip: padding-box; }
    html { scrollbar-width: thin; scrollbar-color: rgba(42,33,24,0.18) transparent; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    @media (max-width: 768px) {
      .grain::before { display: none; }
      .animate-aurora, .animate-fade-in-up { animation: none !important; }
      .shimmer-text { animation: none !important; background-position: center; }
      .glass { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
