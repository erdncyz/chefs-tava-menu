[build]
  command = "npm run build"
  publish = "dist"

# SPA routing için redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performans ve güvenlik header'ları
[[headers]]
  for = "/*"
  [headers.values]
    # Cache kontrolü - statik dosyaları önbelleğe al
    Cache-Control = "public, max-age=31536000, immutable"
    # Bağlantı sorunlarını azaltmak için
    Connection = "keep-alive"
    # Güvenlik
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# HTML dosyaları için farklı cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# index.html için
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
